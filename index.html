<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mohd Suzaimi - Business Card</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }

        .profile {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: auto;
            display: block;
        }

        h1 {
            margin-bottom: 5px;
        }

        .position {
            color: #666;
            margin-top: 0;
        }

        .button {
            display: block;
            text-decoration: none;
            background: #111;
            color: white;
            padding: 15px;
            margin: 12px 0;
            border-radius: 10px;
            font-size: 16px;
        }

        .button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="card">

        <img class="profile" src="profile.jpg" alt="Profile Photo">

        <h1>Mohd Suzaimi</h1>

        <p class="position">
            IT Executive
        </p>

        <p>
            Perdana Kuala Lumpur City Centre
        </p>

        <a class="button"
           href="https://wa.me/60146251488">
            💬 WhatsApp
        </a>

        <a class="button"
           href="tel:+60123456789">
            📞 Call Me
        </a>

        <a class="button"
           href="mailto:suzaimi.j@attanahotels.com">
            ✉️ Email
        </a>


    </div>

</body>

</html>
